<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3 sm:px-6">
    <a routerLink="/" class="text-lg font-bold text-slate-900">Dely Pagos</a>

    <nav class="flex flex-1 flex-wrap gap-1" aria-label="Módulos">
      @for (modulo of modulos(); track modulo.ruta) {
        <a
          [routerLink]="['/', modulo.ruta]"
          routerLinkActive="bg-slate-900 text-white hover:bg-slate-900"
          class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
        >
          {{ modulo.titulo }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-3">
      <div class="text-right leading-tight">
        <p class="text-sm font-semibold text-slate-900">{{ usuario()?.nombre }}</p>
        <p class="text-xs text-slate-500">{{ etiquetaRol() }}</p>
      </div>
      <button
        type="button"
        class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 focus:ring-2 focus:ring-slate-900/30 focus:outline-none"
        (click)="salir()"
      >
        Salir
      </button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
  <router-outlet />
</main>
